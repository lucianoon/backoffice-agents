name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backoffice
          POSTGRES_PASSWORD: backoffice
          POSTGRES_DB: backoffice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backoffice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB_URL: postgresql+psycopg://backoffice:backoffice@localhost:5432/backoffice
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra postgres
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: contratos dos adapters (mocks)
        run: uv run backoffice contracts --allow-writes
