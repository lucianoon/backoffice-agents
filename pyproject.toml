[project]
name = "backoffice-agents"
version = "0.1.0"
description = "Piloto de agentes de backoffice: LLM gera e raciocina, Jev (TypeSafe AI) decide, roteia e verifica"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "langsmith>=0.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
bedrock = ["langchain-aws>=0.2"]
gemini = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]
postgres = ["psycopg[binary]>=3.1"]
langfuse = ["langfuse>=2.0"]
aws = ["boto3>=1.34"]

[project.scripts]
backoffice = "backoffice_agents.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backoffice_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC"]
# capturas amplas são deliberadas nas fronteiras (Jev, ferramentas, retomada): fail-closed
# B008: `typer.Option(...)` em defaults é o idioma do typer
ignore = ["BLE001", "B008"]
